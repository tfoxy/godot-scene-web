name: rs-setup
description: >-
  Toolchain for remote render-stream validation runs (docs/remote-compute.md). R0a provides only
  what the `pure`, `pnpm-test` and `cargo-*` runs need: node and pnpm (versions from mise.toml),
  `pnpm install --frozen-lockfile` with a store cache, Rust 1.95.0 and `cargo fetch` for the
  render-stream crates (their `cargo test` runs --offline) with a registry cache. The later-rung
  inputs below exist so workflows can already name them; enabling one fails loudly until its rung
  implements it.

inputs:
  rust-version:
    description: Rust toolchain for the cargo-* runs (matches the local stable)
    default: 1.95.0
  # ---- later rungs: disabled by default, not implemented at R0a ---------------------------------
  godot:
    description: "R0b: mise Godot editor (asdf-godot plugin), sha-verified"
    default: "false"
  templates:
    description: "R0b: 4.5.1 linux_release.x86_64 + web_dlink_nothreads_release.zip from the .tpz, sha-verified"
    default: "false"
  emsdk:
    description: "R0b: emsdk 4.0.11"
    default: "false"
  nightly:
    description: "R0b: Rust nightly-2025-10-15 with rust-src (-Zbuild-std)"
    default: "false"
  wasm-bindgen:
    description: "R0b: wasm-bindgen-cli 0.2.129"
    default: "false"
  chromium:
    description: >-
      Playwright's Chromium (the repo's pinned @playwright/test version) installed on the runner,
      for pnpm-test's browser tests. R3 adds the sha check against the pinned build.
    default: "false"
  gamescope:
    description: "R1: apt gamescope/xvfb/mesa-vulkan-drivers/strace for rendered legs"
    default: "false"

runs:
  using: composite
  steps:
    - name: Refuse rungs that are not implemented yet
      shell: bash
      env:
        GODOT: ${{ inputs.godot }}
        TEMPLATES: ${{ inputs.templates }}
        EMSDK: ${{ inputs.emsdk }}
        NIGHTLY: ${{ inputs.nightly }}
        WASM_BINDGEN: ${{ inputs.wasm-bindgen }}
        GAMESCOPE: ${{ inputs.gamescope }}
      run: |
        for pair in godot:"$GODOT" templates:"$TEMPLATES" emsdk:"$EMSDK" nightly:"$NIGHTLY" \
          wasm-bindgen:"$WASM_BINDGEN" gamescope:"$GAMESCOPE"; do
          if [ "${pair#*:}" = "true" ]; then
            echo "::error::rs-setup input '${pair%%:*}' is not implemented at R0a"
            exit 1
          fi
        done

    # The repo only allows actions owned by GitHub, the owner, or pnpm/action-setup, so node and pnpm
    # come the way publish.yml gets them (versions equal mise.toml's), not through jdx/mise-action.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.26.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.12.0
        cache: pnpm

    # validate-increment's pnpm-test run calls `mise exec -- pnpm test`. A mise stand-in that just
    # execs the command keeps the runner scripts identical to local (no mise download here).
    - name: mise stand-in
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/shim"
        printf '#!/usr/bin/env bash\n[ "$1" = exec ] && shift\n[ "$1" = -- ] && shift\nexec "$@"\n' >"$RUNNER_TEMP/shim/mise"
        chmod +x "$RUNNER_TEMP/shim/mise"
        echo "$RUNNER_TEMP/shim" >>"$GITHUB_PATH"

    - name: pnpm install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Playwright Chromium
      if: inputs.chromium == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: Rust toolchain
      shell: bash
      env:
        RUST_VERSION: ${{ inputs.rust-version }}
      run: |
        rustup toolchain install "$RUST_VERSION" --profile minimal
        rustup default "$RUST_VERSION"
        rustc --version

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-registry-${{ runner.os }}-${{ hashFiles('experiments/render-stream/*/Cargo.lock', 'experiments/render-stream/web/*/Cargo.lock') }}
        restore-keys: cargo-registry-${{ runner.os }}-

    - name: cargo fetch
      shell: bash
      run: |
        for lock in experiments/render-stream/*/Cargo.lock experiments/render-stream/web/*/Cargo.lock; do
          [ -f "$lock" ] || continue
          (cd "$(dirname "$lock")" && cargo fetch --locked)
        done
