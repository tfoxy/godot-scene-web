name: Publish npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Refuse to publish a tree that fails the public-tree policy (docs/commit-and-release.md).
      - run: python3 scripts/check-public-tree.py

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.26.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # `tsc` is TypeScript 7; consumers alias this repo's source and typecheck it with TS 6.
      - run: pnpm typecheck:ts6
      - run: pnpm test
      - run: pnpm build
      - run: pnpm release:check-tag "${{ github.ref_name }}"
      # This repo creates no GitHub Release, so CHANGELOG.md is the published record of what a
      # version contains. Refuse to publish a version that has no section.
      - run: ./scripts/changelog-section.sh "${{ github.ref_name }}"
      - run: pnpm -r --filter './packages/**' publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
