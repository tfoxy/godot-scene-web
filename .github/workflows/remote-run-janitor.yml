# Backstop for remote-run/* branches (docs/remote-compute.md): a run's own cleanup job and the
# wrapper's traps normally delete them; this deletes any that survived 24 h.
name: remote-run-janitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_age_h:
        description: Delete remote-run/* branches whose tip is older than this many hours
        required: false
        default: "24"

permissions:
  contents: write

jobs:
  janitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Delete stale run branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_AGE_H: ${{ inputs.max_age_h || '24' }}
        run: scripts/remote-run-branch.sh janitor --max-age-h "$MAX_AGE_H"
