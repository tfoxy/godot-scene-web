# Seeds the Actions caches that remote-validate.yml's run branches restore (docs/remote-compute.md).
# A cache saved on a run branch is readable only by that branch, while main's caches are readable
# by every branch, so every cache is saved here, on main, and the run branches only restore.
# Weekly, on demand (gh workflow run remote-cache-seed.yml --ref main), and on every push to main
# that changes a cache key's inputs: the capture build key is an exact hash, so after a capture
# change every run job rebuilt it (~6 min each) until the next weekly seed. The paths below are the
# hashFiles() and pin inputs of rs-setup's keys; keep them in step with action.yml.
name: remote-cache-seed

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - experiments/render-stream/*/Cargo.lock
      - experiments/render-stream/web/*/Cargo.lock
      - experiments/render-stream/capture/**
      - experiments/render-stream/scripts/build-capture.sh
      - experiments/render-stream/rs-core/**
      - experiments/render-stream/rs-core-capi/**
      - packages/canvas/rust-draw-list/**
      - experiments/render-stream/receiver/ext/*.cpp
      - experiments/render-stream/receiver/ext/*.h
      - experiments/render-stream/scripts/build-rs-core-ext.sh
      - experiments/render-stream/scripts/build-web-receiver.sh
      - experiments/render-stream/scripts/run-gate0.sh
      - .github/actions/rs-setup/**
      - .github/workflows/remote-cache-seed.yml

permissions:
  contents: read

concurrency:
  group: remote-cache-seed
  cancel-in-progress: false

jobs:
  seed:
    # a run branch dispatching this would save its caches where only that branch can read them
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup clock start
        run: echo "SETUP_T0=$(date +%s)" >>"$GITHUB_ENV"

      - uses: ./.github/actions/rs-setup
        with:
          save: "true"
          godot: "true"
          templates: "true"
          emsdk: "true"
          rust-nightly: "true"
          wasm-bindgen: "true"
          fonts: "true"
          apt: "true"
          capture-build: "true"
          rs-core-ext: "true"

      - name: Report
        run: |
          echo "seed setup: $(( $(date +%s) - SETUP_T0 )) s"
          du -sh ~/.cache/godot-render-stream/* "$HOME"/.cargo/registry experiments/render-stream/capture/build \
            experiments/render-stream/receiver/ext/build 2>/dev/null
