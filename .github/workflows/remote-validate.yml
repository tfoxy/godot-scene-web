# Remote validation runs. Dispatched only by scripts/remote-validate.sh, on its throwaway
# remote-run/<id>-<sha> branch; nothing triggers it otherwise. No secrets.
#
# The repository is public, so its runs are too: the title carries only the wrapper's opaque run
# key, <id> is an opaque hash of the worktree path, and artifacts live one day. The job-*, det-* and
# determinism artifacts only carry data between jobs and are deleted once the merge has run; the
# small `summary` is what the wrapper downloads; run evidence is uploaded only for a failing run.
name: remote-validate
run-name: remote-validate ${{ inputs.run_key }}

on:
  workflow_dispatch:
    inputs:
      run_key:
        description: Unique key; the wrapper finds this run by it
        required: true
      worktree:
        description: Opaque worktree id (concurrency group)
        required: true
      sha:
        description: Snapshot commit to validate
        required: true
      base:
        description: Merge-base sha with main
        required: true
      tier:
        description: smoke or full
        required: true
        default: smoke
      runs:
        description: JSON list of validate-increment run ids
        required: true
      milestone:
        description: "'' (no), complete, or delta"
        required: false
        default: ""
      paths:
        description: Comma-separated explicit changed paths (validate-increment --paths)
        required: false
        default: ""
      refused:
        description: JSON list of {id, reason} the wrapper kept local
        required: false
        default: "[]"
      determinism:
        description: >-
          '' (off), or comma-separated repeat counts, one job each (e.g. 3,1): every run is repeated
          that many times per job and lib/remote-determinism.ts compares all repeats' shots and dumps
        required: false
        default: ""
      run_groups:
        description: >-
          JSON {run id: [groups]} for the gate 7 runs of several groups: one job per group, each
          with RS_VALIDATE_GROUPS; the merge folds them into the run's one row
        required: false
        default: "{}"
      browser_renderer:
        description: >-
          gate 7 browser legs' CI-only software renderer (RS_BROWSER_PROVENANCE, lib/browser-renderer.ts):
          lavapipe, ANGLE-Vulkan on the llvmpipe the native sources render on (the only one)
        required: false
        default: lavapipe
      leg_shards:
        description: >-
          auto (default), off or force: split the long runs the table names (native gate 8, g7-8) into
          jobs by gate 8 group when the simulated makespan drops (lib/remote-matrix.py)
        required: false
        default: auto

permissions:
  contents: read

concurrency:
  group: remote-validate-${{ inputs.worktree }}
  cancel-in-progress: true

env:
  # `pure` runs as this many parallel jobs (RS_PURE_SHARD=i/n); the merge job folds them back into
  # one `pure` run entry
  PURE_SHARDS: "6"
  # the validate matrix's concurrent jobs (the account runs 20 at once, shared by every agent). A
  # full tier is about 700 job-minutes, 60% of it rs-setup (8-11 min a job), so at 10 slots it was
  # throughput-bound (floor ~72 min) whatever the order; 16 leaves 4 slots to other agents' smoke
  # runs, and agents do not dispatch a full tier over another one
  MAX_PARALLEL: "16"
  # build-capture.sh defaults to /snap/bin/cmake
  CMAKE: cmake
  # Watchdog: minutes per validate-increment invocation, a per-job value in the plan job's matrix
  # (matrix.watchdog, lib/remote-matrix.py): 2x the job's expected validate minutes, clamped to
  # [35, 60] (35 was about 2x the longest gate 7 group when the watchdog was set; the
  # unsharded g7-8 web-rust job was later raised to 60, which the rule keeps). It must stay well under the job's
  # 120-min timeout, so a hang leaves evidence and a failing row.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
      shards: ${{ steps.expand.outputs.shards }}
      max_parallel: ${{ steps.expand.outputs.max_parallel }}
    steps:
      # the matrix script, its table and the runner scripts whose group lists the leg shards read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            experiments/render-stream/scripts/lib/remote-matrix.py
            experiments/render-stream/scripts/remote-jobs.json
            experiments/render-stream/scripts/run-gate7.sh
            experiments/render-stream/scripts/run-gate8.sh
          sparse-checkout-cone-mode: false
      # lib/remote-matrix.py: one job per run, per gate 7 group (<id>@<group>), per pure shard,
      # per determinism repeat count; leg shards of native gate 8 and g7-8 (<label>-<k>of<n>,
      # matrix.legs) when they shorten the simulated makespan; ordered longest first, so the long
      # poles start in the first wave; the merge folds every job of a run id into its one row
      # (shards = jobs per id).
      - id: expand
        env:
          RUNS: ${{ inputs.runs }}
          DETERMINISM: ${{ inputs.determinism }}
          RUN_GROUPS: ${{ inputs.run_groups }}
          LEG_SHARDS: ${{ inputs.leg_shards }}
          # a milestone sweep is the full tier (validate-increment.sh --milestone)
          TIER: ${{ inputs.milestone != '' && 'full' || inputs.tier }}
        run: |
          python3 experiments/render-stream/scripts/lib/remote-matrix.py --runs "$RUNS" --run-groups "$RUN_GROUPS" \
            --determinism "$DETERMINISM" --pure-shards "$PURE_SHARDS" --max-parallel "$MAX_PARALLEL" \
            --leg-shards "${LEG_SHARDS:-auto}" --tier "$TIER" --github-output "$GITHUB_OUTPUT" --explain

  validate:
    name: ${{ matrix.label }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup clock start
        run: |
          echo "SETUP_T0=$(date +%s)" >>"$GITHUB_ENV"
          # a private lock directory: this job's legs never wait on another job's
          echo "RS_QUIET_LOCK_DIR=$RUNNER_TEMP/quiet-lock" >>"$GITHUB_ENV"

      - uses: ./.github/actions/rs-setup
        with:
          # pnpm-test's browser tests use Playwright's own install; gate 7 needs the pinned
          # chromium-1223, sha-checked against browser-harness.ts's EXPECTED_CHROMIUM_SHA256, and
          # so does native gate 8, whose g8kp group replays its /9 recording in the GSW receiver
          chromium: ${{ matrix.id == 'pnpm-test' || startsWith(matrix.id, 'g7') || matrix.id == 'native-rust-gate8' }}
          chromium-pinned: ${{ startsWith(matrix.id, 'g7') || matrix.id == 'native-rust-gate8' }}
          browser-renderer: ${{ (startsWith(matrix.id, 'g7') || matrix.id == 'native-rust-gate8') && inputs.browser_renderer || '' }}
          # the pure self-tests include rs-ws, which runs the capture build's rs_ws_echo (a local
          # worktree runs build-capture.sh once for the same reason): restored from the seeded cache.
          # A native gate needs the capture extension too, and so does every gate 7 run: its sources
          # (--make-sources) and live hosts are native gate runs.
          libcxx: ${{ matrix.id == 'libcxx-control' }}
          llvm-mingw: ${{ matrix.id == 'windows' }}
          capture-build: ${{ matrix.id == 'pure' || startsWith(matrix.id, 'native-') || startsWith(matrix.id, 'g7') || matrix.id == 'libcxx-control' || matrix.id == 'windows' }}
          # native-* runs: rendered legs on Xvfb + llvmpipe, the rs-core GDExtension, the
          # release template, the editor (imports, receiver self-test) and strace
          swrast: ${{ startsWith(matrix.id, 'native-') || startsWith(matrix.id, 'g7') || matrix.id == 'libcxx-control' }}
          rs-core-ext: ${{ startsWith(matrix.id, 'native-') || startsWith(matrix.id, 'g7') || matrix.id == 'libcxx-control' }}
          valgrind: ${{ matrix.id == 'bench-instr' }}
          apt: ${{ startsWith(matrix.id, 'native-') || startsWith(matrix.id, 'g7') || matrix.id == 'libcxx-control' }}
          # gate 4's i18n fixtures read the engine's thirdparty/fonts (fonts.lock.json); g7-4's
          # source is a gate 4 run
          fonts: ${{ matrix.id == 'native-rust-gate4' || startsWith(matrix.id, 'g7-') }}
          # toolchain-smoke (remote-validate.sh --toolchain-smoke) builds with every pinned input;
          # gate 7 builds the web receiver (web-rust) or the gsw bundle (build-rs-core.sh), and so
          # does native gate 8, whose g8ku group replays its /9 recording in the web export
          godot: ${{ matrix.id == 'toolchain-smoke' || startsWith(matrix.id, 'native-') || startsWith(matrix.id, 'g7') || matrix.id == 'libcxx-control' || matrix.id == 'windows' }}
          templates: ${{ matrix.id == 'toolchain-smoke' || startsWith(matrix.id, 'native-') || startsWith(matrix.id, 'g7') || matrix.id == 'libcxx-control' || matrix.id == 'windows' }}
          # every gate 7 run: the web receiver (web-rust), and the gsw bundle's KTX2
          # transcoder wasm (build-basis-transcoder.sh)
          emsdk: ${{ matrix.id == 'toolchain-smoke' || startsWith(matrix.id, 'g7') || matrix.id == 'native-rust-gate8' }}
          rust-nightly: ${{ matrix.id == 'toolchain-smoke' || startsWith(matrix.id, 'g7') || matrix.id == 'native-rust-gate8' }}
          # cargo-gsw-rs checks the crate for wasm32 (it has no host-runnable test)
          wasm-bindgen: ${{ matrix.id == 'toolchain-smoke' || matrix.id == 'cargo-gsw-rs' || startsWith(matrix.id, 'g7') || matrix.id == 'native-rust-gate8' || matrix.id == 'windows' }}

      - name: Record setup time
        run: |
          mkdir -p "$RUNNER_TEMP/art"
          echo $(( $(date +%s) - SETUP_T0 )) >"$RUNNER_TEMP/art/setup_s"

      - name: toolchain smoke
        if: matrix.id == 'toolchain-smoke'
        run: bash scripts/remote-toolchain-smoke.sh --out "$RUNNER_TEMP/v"

      - name: validate-increment
        if: matrix.id != 'toolchain-smoke'
        env:
          ID: ${{ matrix.id }}
          RS_PURE_SHARD: ${{ matrix.shard }}
          BASE: ${{ inputs.base }}
          TIER: ${{ inputs.tier }}
          MILESTONE: ${{ inputs.milestone }}
          CHANGED_PATHS: ${{ inputs.paths }}
          REPEAT: ${{ matrix.repeat }}
          LABEL: ${{ matrix.label }}
          RS_VALIDATE_GROUPS: ${{ matrix.group }}
          # a leg shard (lib/remote-matrix.py): the gate 8 groups this job runs (native --legs, g7-8
          # GATE7_G8_LEGS); empty for every other job
          RS_VALIDATE_LEGS: ${{ matrix.legs }}
          # the per-shard watchdog, set in the plan job's matrix (matrix.watchdog).
          WATCHDOG_MIN: ${{ matrix.watchdog }}
          # native gates: 4 vCPU run two legs at once. The timing groups inside the correctness
          # gates (g1c-rate, g1d, g2c-pins, g5f, g55f) are wall-clock legs a shared VM would only make
          # noisy: they are skipped here (skipped-remote.txt) and stay local. Never set locally.
          RS_LEG_SHARDS: ${{ (startsWith(matrix.id, 'native-') || matrix.id == 'libcxx-control' || startsWith(matrix.id, 'g7')) && '2' || '' }}
          # gate 7: a file run (g7-gsw, g7-web-rust) skips every timing group too: the gsw half
          # makes FULL native sources (run-gate7.sh --make-sources: gates 1, 2 and 5 carry g1c-rate,
          # g1d, g2c-pins, g5f), and source-run-valid@gsw excuses exactly those by tier-verdict.py
          # (gate7-gsw.ts remoteSkipExcused); the web half's sources are file legs only. A live
          # correctness run (g7-1/g7-2/g7-5/g7-55) skips only g1c-rate, its one rate leg -- g1d,
          # g2c-pins, g5f and g55f are frame-counted under fast frames (lib/legs.sh
          # RS_FAST_ALLOW_LEGS) and are the browser's live correctness legs. The timing groups
          # (g7-6, g7-lc, g7-r, g7-k) are -timing runs, refused by phase.
          RS_SKIP_TIMING_GROUPS: ${{ (startsWith(matrix.id, 'native-') || matrix.id == 'libcxx-control' || startsWith(matrix.id, 'g7-')) && '1' || (startsWith(matrix.id, 'g7live-') && 'g1c-rate' || '') }}
          # the CI-only browser allowance (lib/browser-renderer.ts; Decision 10): only here
          RS_BROWSER_PROVENANCE: ${{ (startsWith(matrix.id, 'g7') || matrix.id == 'native-rust-gate8') && inputs.browser_renderer || '' }}
        run: |
          # the planner's default base is `main`; point it at the merge-base the wrapper computed
          git update-ref refs/heads/main "$BASE"
          args=(--only "$ID" --tier "$TIER" --out "$RUNNER_TEMP/v")
          case "$MILESTONE" in
            complete) args+=(--milestone) ;;
            delta) args+=(--milestone --base "$BASE") ;;
            *) args+=(--base "$BASE") ;;
          esac
          [ -n "$CHANGED_PATHS" ] && args+=(--paths "$CHANGED_PATHS")
          mkdir -p "$RS_QUIET_LOCK_DIR"
          # vi OUT ARGS...: validate-increment under the watchdog (a gsw g7-2 job once hung past 90 min
          # and was cancelled with no log). 45 s before the deadline it snapshots
          # the process tree and the quiet lock; on the deadline timeout kills the run's process
          # group, and the newest logs' tails go to $RUNNER_TEMP/watchdog (Trim artifact uploads it).
          # The run's row then fails (rc missing) instead of the job dying silent.
          vi() {
            local out="$1" s=$((WATCHDOG_MIN * 60)) rc wd w="$RUNNER_TEMP/watchdog"
            shift
            ( sleep $((s - 45)) && mkdir -p "$w" && {
                date -u; uptime; ps -eo pid,ppid,etimes,pcpu,rss,args --forest
                bash experiments/render-stream/scripts/lib/quiet.sh status
              } >"$w/ps-$(basename "$out").txt" 2>&1 ) &
            wd=$!
            timeout -k 60 "$s" bash experiments/render-stream/scripts/validate-increment.sh "$@"
            rc=$?
            kill "$wd" 2>/dev/null
            if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
              echo "::error::watchdog: validate-increment ($out) exceeded $WATCHDOG_MIN min and was killed"
              mkdir -p "$w/logs-$(basename "$out")"
              find "$out" -type f -name '*.log' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -30 |
                cut -d' ' -f2- | while read -r f; do
                  r="${f#"$out"/}"
                  tail -c 20000 "$f" >"$w/logs-$(basename "$out")/${r//\//__}"
                done
            fi
            return "$rc"
          }
          if [ -z "$REPEAT" ]; then
            vi "$RUNNER_TEMP/v" "${args[@]}"
            exit $?
          fi
          # determinism mode: REPEAT runs on this runner, $RUNNER_TEMP/v (the first) then v2..vN; the
          # job's summary folds them into one row, and every repeat's digest goes to det-<label>
          rc=0 outs=()
          for k in $(seq 1 "$REPEAT"); do
            o="$RUNNER_TEMP/v"; [ "$k" = 1 ] || o="$RUNNER_TEMP/v$k"
            args[5]="$o" # --out's value
            vi "$o" "${args[@]}" || rc=1
            outs+=("$o/")
            # only a digest of each repeat travels (every shot's sha256, every masked dump's
            # canonical hash, the live-set keys, the provenance): a gate 7 run dir is GBs
            mkdir -p "$RUNNER_TEMP/det/$LABEL"
            # the web builds' records: a web pck's build_sha256 is compared by content (its export
            # order varies across runners, its entries do not; remote-determinism.ts buildContentMap)
            brec=()
            for r in artifacts/render-stream/web-receiver/*/bundle/build.json; do [ -f "$r" ] && brec+=(--build-record "$r"); done
            [ -d "$o/$ID/run" ] && pnpm exec tsx --conditions=development experiments/render-stream/scripts/lib/remote-determinism.ts \
              --digest "$o/$ID/run" --out "$RUNNER_TEMP/det/$LABEL/r$k.digest.json" "${brec[@]}" || true
          done
          # this runner's repeats are compared here too, as directories: a disagreement gets its pixel
          # report (count, bbox, channel deltas), which digests alone cannot give
          runs=()
          for o in "${outs[@]}"; do [ -d "$o$ID/run" ] && runs+=("$o$ID/run"); done
          [ "${#runs[@]}" -ge 2 ] && pnpm exec tsx --conditions=development experiments/render-stream/scripts/lib/remote-determinism.ts \
            --out "$RUNNER_TEMP/det/$LABEL/same-runner.json" "${brec[@]}" "${runs[@]}" | grep -v '^  \(GL\|Vulkan\)' | tail -40 || true
          cp "$RUNNER_TEMP/swrast-provenance.json" "$RUNNER_TEMP/det/$LABEL/" 2>/dev/null || true
          cp "$RUNNER_TEMP/browser-provenance.json" "$RUNNER_TEMP/det/$LABEL/" 2>/dev/null || true
          # gate 7: the builds the repeats used (web build.json + pck, gsw bundle record), beside r1..rN:
          # not compared, but a build that differs across runners is diagnosed from them
          for b in artifacts/render-stream/web-receiver/*/bundle; do
            [ -d "$b" ] || continue
            w="$RUNNER_TEMP/det/$LABEL/builds/web-$(basename "$(dirname "$b")")"
            mkdir -p "$w" && cp "$b"/build.json "$b"/*.pck "$w/" 2>/dev/null || true
          done
          for b in "$RUNNER_TEMP"/v*/"$ID"/run/gsw-bundle; do
            [ -f "$b/build.json" ] && mkdir -p "$RUNNER_TEMP/det/$LABEL/builds" && cp "$b/build.json" "$RUNNER_TEMP/det/$LABEL/builds/gsw-build.json" || true
          done
          python3 experiments/render-stream/scripts/lib/validate-summary.py --merge --out "$RUNNER_TEMP/vmerged" \
            --expect "$ID" "${outs[@]}" || true
          cp "$RUNNER_TEMP/vmerged/validate-summary.json" "$RUNNER_TEMP/v/validate-summary.json"
          exit $rc

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.label == 'windows'
        with:
          name: wbundle
          path: experiments/render-stream/capture/build-windows/bundle
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.label == 'windows'
        with:
          name: wfile-linux
          path: experiments/render-stream/capture/build-windows/wfile-linux
          retention-days: 1
          if-no-files-found: ignore

      - name: Trim artifact
        if: always()
        timeout-minutes: 10
        env:
          ID: ${{ matrix.id }}
          LABEL: ${{ matrix.label }}
          LEGS: ${{ matrix.legs }}
          GROUP: ${{ matrix.group }}
        run: |
          set +e # best effort: a job that died in setup has no run dir, and that must not fail here
          art="$RUNNER_TEMP/art"
          mkdir -p "$art"
          [ -f "$RUNNER_TEMP/v/validate-summary.json" ] && cp "$RUNNER_TEMP/v/validate-summary.json" "$art/"
          [ -f "$RUNNER_TEMP/v/$ID/run/libcxx-control.json" ] && cp "$RUNNER_TEMP/v/$ID/run/libcxx-control.json" "$art/"
          [ -f "$RUNNER_TEMP/v/$ID/run/provenance.json" ] && cp "$RUNNER_TEMP/v/$ID/run/provenance.json" "$art/libcxx-provenance.json"
          [ -d "$RUNNER_TEMP/v/$ID/run/comparisons" ] && cp -r "$RUNNER_TEMP/v/$ID/run/comparisons" "$art/libcxx-comparisons"
          if [ "$ID" = libcxx-control ]; then
            control="$RUNNER_TEMP/v/$ID/run"
            [ -f "$control/build-libcxx.log" ] && cp "$control/build-libcxx.log" "$art/"
            for label in gcc-a libcxx gcc-b; do
              for gate in gate0 gate1 gate2 gate8; do
                src="$control/$label/$gate"
                [ -f "$src/tier-verdict.json" ] || [ -f "$src.log" ] || continue
                dest="$art/libcxx-gates/$label/$gate"
                mkdir -p "$dest"
                [ -f "$src/tier-verdict.json" ] && cp "$src/tier-verdict.json" "$dest/"
                [ -f "$src.log" ] && tail -n 400 "$src.log" >"$dest/runner.log"
              done
            done
          fi
          # per-test seconds of a pure shard (a few KB): the input to pure-shard-weights.json
          [ -f "$RUNNER_TEMP/v/$ID/toolchain-hashes.json" ] && cp "$RUNNER_TEMP/v/$ID/toolchain-hashes.json" "$art/"
          [ -f "$RUNNER_TEMP/v/$ID/quiet-lock.jsonl" ] && cp "$RUNNER_TEMP/v/$ID/quiet-lock.jsonl" "$art/timings-$LABEL.jsonl"
          # a gate's per-leg lock log (a few hundred KB at most): the per-group minutes behind
          # remote-jobs.json's leg-shard weights
          [ -f "$RUNNER_TEMP/v/$ID/run/quiet-lock.jsonl" ] && cp "$RUNNER_TEMP/v/$ID/run/quiet-lock.jsonl" "$art/legs-$LABEL.jsonl"
          # the check ids of the run's own verdict (lib/check-census.py): the merge's checks.json
          # shows a leg-sharded run judged the same checks as the whole run
          [ -d "$RUNNER_TEMP/v/$ID/run" ] && python3 -I experiments/render-stream/scripts/lib/check-census.py \
            --job "$RUNNER_TEMP/v/$ID/run" --id "$ID" --label "$LABEL" --group "$GROUP" --legs "$LEGS" --out "$art/checks-$LABEL.json"
          # bench-instr's per-case Ir, rustc, valgrind, CPU model and binary sha (a few KB)
          for o in "$RUNNER_TEMP"/v "$RUNNER_TEMP"/v[0-9]*; do
            [ -f "$o/$ID/run/bench-instr.json" ] && cp "$o/$ID/run/bench-instr.json" "$art/bench-instr-$LABEL${o##*/v}.json"
          done
          # where the run dir holds symlinks (a walker that follows them can loop); find -P
          [ -d "$RUNNER_TEMP/v/$ID" ] && timeout 60 find "$RUNNER_TEMP/v/$ID" -type l -printf '%p -> %l\n' 2>/dev/null | head -200 >"$art/symlinks-$LABEL.txt"
          # the watchdog's snapshot and log tails, when it fired or got close
          [ -d "$RUNNER_TEMP/watchdog" ] && cp -r "$RUNNER_TEMP/watchdog" "$art/watchdog"
          # swrast provenance plus the GL renderer string the run's Godot printed (OpenGL API ... llvmpipe)
          [ -f "$RUNNER_TEMP/swrast-provenance.json" ] && python3 -I - "$RUNNER_TEMP/swrast-provenance.json" "$RUNNER_TEMP/v/$ID/run" "$art/swrast-provenance.json" <<'PY'
          import json, os, re, sys
          # never glob("**") here. glob follows directory symlinks, and a harness run dir
          # holds symlinks into itself and into the source cache (an endless walk once hung the
          # job for 2 h). os.walk does not follow them.
          def walk_files(root, name):
              hits = []
              for d, dirs, files in os.walk(root, followlinks=False):
                  dirs[:] = [x for x in dirs if not os.path.islink(os.path.join(d, x))]
                  if name in files and not os.path.islink(os.path.join(d, name)):
                      hits.append(os.path.join(d, name))
              return sorted(hits)
          p = json.load(open(sys.argv[1]))
          for f in walk_files(sys.argv[2], "stdout.log"):
              m = re.search(r"^OpenGL API .*$", open(f, errors="replace").read(), re.M)
              if m:
                  p["godot_gl"] = m.group(0)
                  break
          # gate 7: the browser's WebGL renderer as a leg recorded it (browser-harness.ts
          # checkBrowserProvenance), and the runner's Vulkan/Chromium facts (rs-setup)
          b = os.path.join(os.environ["RUNNER_TEMP"], "browser-provenance.json")
          if os.path.isfile(b):
              p["browser_setup"] = json.load(open(b))
          for f in walk_files(sys.argv[2], "provenance.json"):
              try:
                  j = json.load(open(f))
              except ValueError:
                  continue
              if isinstance(j.get("renderer"), str):
                  p["browser"] = {k: j.get(k) for k in ("renderer", "vendor", "version", "args", "binarySha256", "ok", "ci_renderer_allowance")}
                  break
          json.dump(p, open(sys.argv[3], "w"), indent=2)
          PY
          # determinism mode: the enriched provenance (browser renderer included) beside the repeats
          [ -d "$RUNNER_TEMP/det/$LABEL" ] && [ -f "$art/swrast-provenance.json" ] && cp "$art/swrast-provenance.json" "$RUNNER_TEMP/det/$LABEL/"
          # every failing repeat's evidence (determinism mode runs v, v2, ...; a repeat-2 failure
          # used to come back with no evidence): evidence/<label> for v, evidence/<label>-r<k> after
          for o in "$RUNNER_TEMP"/v "$RUNNER_TEMP"/v[0-9]*; do
            run="$o/$ID"
            [ -d "$run" ] || continue
            rc="$(cat "$run/rc" 2>/dev/null || echo missing)"
            [ "$rc" != 0 ] || continue
            k="${o##*/v}"
            ev="$art/evidence/$LABEL${k:+-r$k}"
            mkdir -p "$ev/run"
            for f in command.txt run.log tier-verdict.json; do [ -f "$run/$f" ] && cp "$run/$f" "$ev/"; done
            [ -f "$run/run/result.json" ] && cp "$run/run/result.json" "$ev/run/"
            [ -f "$run/run/bench-instr.json" ] && cp "$run/run/bench-instr.json" "$ev/run/"
            cp "$run"/*.log "$ev/" 2>/dev/null
            # the small per-leg files that explain a failing check (a leg's stdout, the
            # receiver's applied.json, the live host's summary), not the stores or recordings.
            # find -P (the default) lists symlinks without following them.
            ( cd "$run/run" 2>/dev/null &&
              timeout 120 find . -type f \( -name applied.json -o -name live-summary.json \
                -o -name stdout.log -o -name stderr.log -o -name steps.jsonl -o -name live.json -o -name 'recording*.rs9' -o -name result.json \) \
                -size -300k -print 2>/dev/null | head -600 |
                timeout 120 cpio -pdm --quiet "$ev/legs" 2>/dev/null )
            # WRP: a web repeat (<gate>/web-repeat/<leg>) or wait probe (<gate>/web-probe/<group>/
            # <probe>/<rest>) is judged on its shots against its first run's (<gate>/web/<leg>), so
            # both keep their shots: lib/gate7-web-flakes.ts repeatDiff then reads them from --collect.
            ( cd "$run/run" 2>/dev/null &&
              timeout 120 find . -type d -name shots \( -path '*/web-repeat/*' -o -path '*/web-probe/*' \) \
                -print 2>/dev/null | head -60 |
                while read -r d; do
                  echo "$d"
                  case "$d" in
                  */web-repeat/*) echo "${d%%/web-repeat/*}/web/${d#*/web-repeat/}" ;;
                  */web-probe/*)
                    p="${d#*/web-probe/}"; rest="${p#*/}"
                    echo "${d%%/web-probe/*}/web/${p%%/*}/${rest#*/}" ;;
                  esac
                done | sort -u | while read -r d; do
                  [ -d "$d" ] && find "$d" -maxdepth 1 -type f -name '*.png' -size -300k -print
                done | head -600 |
                timeout 120 cpio -pdm --quiet "$ev/legs" 2>/dev/null )
          done
          true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: job-${{ matrix.label }}
          path: ${{ runner.temp }}/art
          retention-days: 1
          if-no-files-found: ignore

      # determinism mode: every repeat's digest (plus provenance, builds, this runner's pixel report)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.repeat
        with:
          name: det-${{ matrix.label }}
          path: ${{ runner.temp }}/det
          retention-days: 1
          if-no-files-found: ignore

  windows:
    name: windows-win
    needs: [plan, validate]
    if: ${{ !cancelled() && contains(fromJSON(inputs.runs), 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experiments/render-stream/scripts/lib/w-run.py
            experiments/render-stream/scripts/w-imports.py

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: wbundle
          path: ${{ runner.temp }}/wbundle

      - name: Windows tests
        shell: pwsh
        run: python -I experiments/render-stream/scripts/lib/w-run.py --bundle "$env:RUNNER_TEMP/wbundle" --out "$env:RUNNER_TEMP/art" --id windows --label windows-win --imports-tool experiments/render-stream/scripts/w-imports.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: job-windows-win
          path: ${{ runner.temp }}/art
          retention-days: 1
          if-no-files-found: ignore

  windows-equiv:
    needs: [plan, validate, windows]
    if: ${{ !cancelled() && contains(fromJSON(inputs.runs), 'windows') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: wfile-linux
          path: ${{ runner.temp }}/wfile-linux

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: job-windows-win
          path: ${{ runner.temp }}/win

      - name: Compare file-sink recordings
        run: |
          pnpm install --frozen-lockfile >/dev/null
          python3 -I experiments/render-stream/scripts/lib/w-equiv.py --linux "$RUNNER_TEMP/wfile-linux" --windows-art "$RUNNER_TEMP/win" --out "$RUNNER_TEMP/art" --id windows --label windows-equiv

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: job-windows-equiv
          path: ${{ runner.temp }}/art
          retention-days: 1
          if-no-files-found: ignore

  windows-live:
    needs: [plan, validate]
    if: ${{ !cancelled() && contains(fromJSON(inputs.runs), 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: wbundle
          path: ${{ runner.temp }}/wbundle

      - name: Windows live carriers
        shell: pwsh
        env:
          WLIVE_REPO_ROOT: ${{ github.workspace }}
        run: python -I experiments/render-stream/scripts/lib/w-run.py --suite live --bundle "$env:RUNNER_TEMP/wbundle" --out "$env:RUNNER_TEMP/art" --id windows --label windows-live --imports-tool experiments/render-stream/scripts/w-imports.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: job-windows-live
          path: ${{ runner.temp }}/art
          retention-days: 1
          if-no-files-found: ignore

  determinism:
    if: always() && inputs.determinism != ''
    needs: [plan, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: det-*
          path: det
          merge-multiple: true

      - name: Compare repeats
        run: |
          pnpm install --frozen-lockfile >/dev/null
          mkdir -p out/gates
          # one comparison per run id: det/<id>-det<k>x<repeats>/r<n>/ of every job of that id (runs of
          # different gates are not a sample of each other)
          rc=0
          for id in $(ls det | sed 's/-det[0-9]*x[0-9]*$//' | sort -u); do
            dirs=(det/"$id"-det*/r*.digest.json)
            # each runner's own pixel report, beside the cross-runner one
            for f in det/"$id"-det*/same-runner.json; do [ -f "$f" ] && mkdir -p out/same-runner && cp "$f" "out/same-runner/$(basename "$(dirname "$f")").json"; done
            pnpm exec tsx --conditions=development experiments/render-stream/scripts/lib/remote-determinism.ts \
              --out "out/gates/$id.json" "${dirs[@]}" || rc=$?
          done
          python3 - <<'PY'
          import glob, json, os
          g = {os.path.basename(f)[:-5]: json.load(open(f)) for f in sorted(glob.glob("out/gates/*.json"))}
          tot = lambda k, f: sum(r[k][f] for r in g.values())
          cpus = {}
          for f in sorted(glob.glob("det/*/swrast-provenance.json")):
              try:
                  cpus[os.path.basename(os.path.dirname(f))] = json.load(open(f)).get("cpu", {}).get("model")
              except ValueError:
                  pass
          json.dump({
              "schema": "render-stream-remote-determinism/1", "per_gate": True,
              "ok": bool(g) and all(r["ok"] for r in g.values()),
              "runs": sum(r["runs"] for r in g.values()),
              "shots": {"total": tot("shots", "total"), "agree": tot("shots", "agree")},
              "dumps": {"total": tot("dumps", "total"), "agree": tot("dumps", "agree")},
              "live_sets": sum(len(r.get("live_sets", [])) for r in g.values()),
              # hosted runners are a CPU lottery (AMD EPYC 7763/9V45/9V74, Intel Xeon 8573C seen),
              # and llvmpipe's output followed the CPU in one dispatch: record which job ran on what
              "cpu_models": cpus,
              "gates": {k: {"ok": r["ok"], "runs": r["runs"], "shots": r["shots"]["agree"], "shots_total": r["shots"]["total"],
                            "dumps": r["dumps"]["agree"], "dumps_total": r["dumps"]["total"],
                            "live_sets": len(r.get("live_sets", [])), "live_timed": len(r.get("live_timed", [])),
                            "provenance_agree": r["provenance_agree"],
                            # web pck: raw sha256 drift is export order (info), content must agree
                            "build_raw_drift": (r.get("build_identity") or {}).get("raw_drift"),
                            "build_content_agree": (r.get("build_identity") or {}).get("content_agree"),
                            "provenance": (r.get("provenance") or [None])[0]} for k, r in g.items()},
          }, open("out/determinism.json", "w"), indent=2)
          PY
          for f in det/*/swrast-provenance.json; do [ -f "$f" ] && cp "$f" "out/provenance-$(basename "$(dirname "$f")").json"; done
          echo "determinism rc=$rc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: determinism
          path: out
          retention-days: 1
          if-no-files-found: ignore

  merge:
    if: always()
    needs: [plan, validate, determinism, windows, windows-equiv, windows-live]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: job-*
          path: jobs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.determinism != ''
        continue-on-error: true
        with:
          name: determinism
          path: determinism

      - name: Merge summaries
        id: merge
        env:
          RUNS: ${{ inputs.runs }}
          REFUSED: ${{ inputs.refused }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          RUN_KEY: ${{ inputs.run_key }}
          DETERMINISM: ${{ inputs.determinism }}
          SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p jobs merged failing
          python3 - <<'PY'
          import json, os
          json.dump({"run_url": os.environ["RUN_URL"], "sha": os.environ["SHA"], "run_key": os.environ["RUN_KEY"],
                     "refused": json.loads(os.environ["REFUSED"] or "[]"),
                     "shards": json.loads(os.environ["SHARDS"] or "{}"),
                     "determinism": os.environ["DETERMINISM"]}, open("remote.json", "w"))
          open("expect.txt", "w").write(",".join(json.loads(os.environ["RUNS"])))
          PY
          # download-artifact puts a lone artifact straight into jobs/ instead of jobs/<name>/
          if [ -f jobs/validate-summary.json ]; then
            mkdir -p jobs/job-single
            for f in jobs/*; do [ "$f" = jobs/job-single ] || mv "$f" jobs/job-single/; done
          fi
          rc=0
          python3 experiments/render-stream/scripts/lib/validate-summary.py --merge --out merged \
            --expect "$(cat expect.txt)" --remote-json remote.json jobs/*/ || rc=$?
          cp jobs/*/toolchain-hashes.json merged/ 2>/dev/null || true
          # the check-id census: per run id, the union of its jobs' checks (lib/check-census.py)
          python3 -I experiments/render-stream/scripts/lib/check-census.py --merge --out merged/checks.json jobs/*/checks-*.json || true
          cp determinism/*.json merged/ 2>/dev/null || true
          for ev in jobs/*/evidence/*; do [ -d "$ev" ] && cp -r "$ev" failing/; done
          echo "failing=$(find failing -mindepth 1 -maxdepth 1 | wc -l)" >>"$GITHUB_OUTPUT"
          echo "merge rc=$rc (1 = some run failed; that is the summary's verdict, not a plumbing error)"
          # red only when the merge itself broke: no summary was written
          test -s merged/validate-summary.json

      # the wrapper's verdict (validate-summary.json, check census, determinism report): needed on
      # success too, and small
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: summary
          path: merged
          retention-days: 1
          if-no-files-found: ignore

      # evidence only for a failing run (the merge itself stays green when a run fails)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || (always() && steps.merge.outputs.failing != '0')
        with:
          name: failing-evidence
          path: failing
          retention-days: 1
          if-no-files-found: ignore

  cleanup:
    if: always()
    needs: [validate, determinism, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # deleting the between-job artifacts
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Delete the run branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
        run: scripts/remote-run-branch.sh delete "$RUN_REF"

      # job-*, det-* and determinism only fed the merge; once it ran, its summary and the failing
      # runs' evidence are all that is kept. Best effort: they expire after a day anyway.
      - name: Delete between-job artifacts
        if: always() && needs.merge.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | test("^(job-|det-)|^determinism$|^wbundle$")) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" >/dev/null || true; done
          true
