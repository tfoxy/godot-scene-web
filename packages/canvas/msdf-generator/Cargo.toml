[package]
name = "godot-scene-web-msdf-generator"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
fdsm = "=0.8.0"
fdsm-ttf-parser = "=0.2.0"
ttf-parser = "=0.25.1"
image = { version = "=0.25.10", default-features = false }
nalgebra = "=0.34.2"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
