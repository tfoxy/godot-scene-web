[package]
name = "chromium-wt-send-wedge"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal repro: Chrome on Android stops sending on a long-lived WebTransport stream"

# Upstream crates only (crates.io, no patches). wtransport's default features give the
# self-signed certificate (rcgen) and ring; `quinn` exposes the QUIC statistics.
[dependencies]
wtransport = { version = "=0.7.2", features = ["quinn"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"

# Not a member of any workspace.
[workspace]
