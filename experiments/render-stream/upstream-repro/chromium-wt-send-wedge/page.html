<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>WebTransport send wedge</title>
<style>
  body { font: 14px monospace; margin: 8px; }
  td { padding: 0 10px 0 0; }
  .bad { color: #b00; font-weight: bold; }
</style>
<h3>WebTransport send-side wedge</h3>
<table id="t"></table>
<p>
  <button id="probe">probe a new bidirectional stream</button>
  <button id="close">writer.close() the lockstep stream</button>
</p>
<pre id="log"></pre>
<script>
// The server fills these in when it serves the page.
const WT_URL = "__WT_URL__";
const CERT_SHA256 = "__CERT_SHA256__";
// How the page answers each message (one writer.write() per answer; the last one is "applied"):
//   ?pattern=raf (default): "received" and "applied" back to back as the message arrives, then
//     "submitted" on the next animation frame (3 writes per message).
//   ?pattern=burst&writes=N: N writes back to back as the message arrives.
//   ?pattern=spread&writes=N&gap=MS: N writes, each in a task of its own, MS ms apart (default 4).
// ?auto=0: no automatic probes after a stall.
const q = new URLSearchParams(location.search);
const PATTERN = q.get("pattern") || "raf";
const WRITES = PATTERN === "raf" ? 3 : Number(q.get("writes") || 1);
const GAP = Number(q.get("gap") || 4);
const AUTO = q.get("auto") !== "0";
const enc = new TextEncoder();
const t0 = performance.now();
const now = () => (performance.now() - t0) / 1000;

const s = (window.state = {
  state: "connecting", received: 0, written: 0, settled: 0, rejected: 0, desiredSize: null,
  lastProgress: null, lastSeq: -1, close: "not called", probes: [], ua: navigator.userAgent,
});
const log = (m) => { document.getElementById("log").textContent += `${now().toFixed(3)} ${m}\n`; };
const show = () => {
  const quiet = s.lastProgress === null ? 0 : now() - s.lastProgress;
  const rows = [
    ["state", s.state], ["messages received", s.received], ["answers written", s.written],
    ["answers settled", s.settled], ["answers rejected", s.rejected],
    ["writer.desiredSize", s.desiredSize], ["last message at", s.lastProgress?.toFixed(3) ?? "-"],
    ["no message for", `${quiet.toFixed(1)} s`], ["close()", s.close],
    ["probes", s.probes.map((p) => p.ms === null ? p.error : `${p.ms} ms`).join(", ") || "-"],
  ];
  document.getElementById("t").innerHTML = rows
    .map(([k, v]) => `<tr><td>${k}</td><td class="${k === "no message for" && quiet > 3 ? "bad" : ""}">${v}</td></tr>`)
    .join("");
};
setInterval(show, 250);

const frame = (kind, bytes) => {
  const f = new Uint8Array(5 + bytes.length);
  f[0] = kind;
  new DataView(f.buffer).setUint32(1, bytes.length, true);
  f.set(bytes, 5);
  return f;
};
const text = (obj) => frame(1, enc.encode(JSON.stringify(obj)));

let wt, writer;
// One write per answer; every write's promise is counted.
const answer = (seq, stage) => {
  const p = writer.write(text({ type: "ack", stream_id: "0123456789abcdef0123456789abcdef", seq, stage, t_us: Math.round(performance.now() * 1000) }));
  s.written++;
  s.desiredSize = writer.desiredSize;
  p.then(() => s.settled++, () => s.rejected++);
};

async function probe() {
  const p = { at: +now().toFixed(3), ms: null, error: null };
  s.probes.push(p);
  const start = performance.now();
  try {
    const st = await wt.createBidirectionalStream();
    const w = st.writable.getWriter();
    await w.write(text({ probe: s.probes.length, page: { received: s.received, written: s.written, settled: s.settled, rejected: s.rejected, desiredSize: writer.desiredSize, close: s.close } }));
    await w.close();
    const r = st.readable.getReader();
    let got = 0;
    for (;;) { const x = await r.read(); if (x.done) break; got += x.value.length; }
    p.ms = Math.round(performance.now() - start);
    log(`probe ${s.probes.length}: new stream answered in ${p.ms} ms (${got} bytes)`);
  } catch (e) {
    p.error = String(e);
    log(`probe ${s.probes.length} failed: ${e}`);
  }
}

function tryClose() {
  s.close = "pending";
  const start = performance.now();
  writer.close().then(
    () => { s.close = `settled after ${Math.round(performance.now() - start)} ms`; log(`close() ${s.close}`); },
    (e) => { s.close = `rejected: ${e}`; log(`close() ${s.close}`); },
  );
}
document.getElementById("probe").onclick = probe;
document.getElementById("close").onclick = tryClose;

async function main() {
  const hash = Uint8Array.from(CERT_SHA256.match(/../g), (h) => parseInt(h, 16));
  wt = new WebTransport(WT_URL, { serverCertificateHashes: [{ algorithm: "sha-256", value: hash }] });
  wt.closed.then((i) => { s.state = `session closed ${JSON.stringify(i)}`; log(s.state); }, (e) => { s.state = `session failed: ${e}`; log(s.state); });
  await wt.ready;
  const st = await wt.createBidirectionalStream();
  writer = st.writable.getWriter();
  writer.write(text({ hello: 1, pattern: PATTERN, writes: WRITES, gap: GAP, ua: navigator.userAgent }));
  s.state = "running";
  log(`session ready, lockstep stream open, pattern ${PATTERN}, ${WRITES} write(s) per message`);

  const undrawn = [];
  const onFrame = () => { while (undrawn.length) answer(undrawn.shift(), "submitted"); requestAnimationFrame(onFrame); };
  if (PATTERN === "raf") requestAnimationFrame(onFrame);

  // Stall watch: after 3 s without a message while running, probe three new streams, then close().
  let watched = false;
  setInterval(async () => {
    if (!AUTO || watched || s.state !== "running" || s.lastProgress === null || now() - s.lastProgress < 3) return;
    watched = true;
    log(`no message for 3 s after ${s.received} messages; ${s.written} answers written, ${s.settled} settled, desiredSize ${writer.desiredSize}`);
    for (let i = 0; i < 3; i++) { await probe(); await new Promise((r) => setTimeout(r, 1000)); }
    tryClose();
    setTimeout(() => log(`5 s after close(): ${s.close}`), 5000);
  }, 500);

  const r = st.readable.getReader();
  let buf = new Uint8Array(0);
  for (;;) {
    const x = await r.read();
    if (x.done) { log("lockstep stream: FIN from the server"); return; }
    const b = new Uint8Array(buf.length + x.value.length);
    b.set(buf); b.set(x.value, buf.length); buf = b;
    while (buf.length >= 5) {
      const len = new DataView(buf.buffer, buf.byteOffset).getUint32(1, true);
      if (buf.length < 5 + len) break;
      const kind = buf[0];
      const body = buf.subarray(5, 5 + len);
      buf = buf.slice(5 + len);
      if (kind !== 0) continue;
      const seq = new DataView(body.buffer, body.byteOffset).getUint32(0, true);
      s.received++; s.lastSeq = seq; s.lastProgress = now();
      if (PATTERN === "raf") { answer(seq, "received"); answer(seq, "applied"); undrawn.push(seq); }
      else if (PATTERN === "spread") for (let i = 0; i < WRITES; i++) setTimeout(() => answer(seq, i === WRITES - 1 ? "applied" : `extra-${i}`), i * GAP);
      else for (let i = 0; i < WRITES; i++) answer(seq, i === WRITES - 1 ? "applied" : `extra-${i}`);
    }
  }
}
main().catch((e) => { s.state = `error: ${e}`; log(s.state); });
</script>
