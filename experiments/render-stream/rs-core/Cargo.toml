[package]
name = "render-stream-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "render-stream decode, validation, resolve and an applier to a packed CanvasItem draw list"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "rs-core-check"
path = "src/bin/rs-core-check.rs"

[[bin]]
name = "rs-core-bench-instr"
path = "src/bin/rs-core-bench-instr.rs"
required-features = ["bench-instr"]

[dependencies]
gsw-canvas-draw-list = { path = "../../../packages/canvas/rust-draw-list" }
sha2 = { version = "0.11", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
# W11t (render-stream-11.md "As built (W11t)"): the live transport's zstd decoder, pure Rust (no C
# toolchain for wasm32). Exact pin; no default features, so no checksum crate (coding.rs computes
# XXH64 itself).
ruzstd = { version = "=0.9.1", default-features = false, features = ["std"] }

[features]
# Portable SHA-256 benchmark builds. sha2 0.11 selects its backend via cfg, not a feature:
# RUSTFLAGS='--cfg sha2_backend="soft"' cargo test --features soft-sha
# Keep the feature as a checked marker so old invocations cannot silently use hardware SHA.
soft-sha = []

# R4: the instruction-count bench binary (scripts/bench-instr.sh); no code, only gates the [[bin]].
bench-instr = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(sha2_backend, values("soft"))', 'cfg(sha2_256_backend, values("soft"))'] }
