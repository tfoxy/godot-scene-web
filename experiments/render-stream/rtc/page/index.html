<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ICE-lite data channel probe</title>
  <h1>ICE-lite data channel probe</h1>
  <pre id="result">Running…</pre>
  <script>
    // Pure helpers also exercised by helpers.test.mjs, directly from this self-contained file.
    function decodeFingerprint(value) {
      if (!/^[A-Za-z0-9_-]{43}$/.test(value))
        throw Error("invalid fingerprint");
      return Uint8Array.from(
        atob(value.replace(/-/g, "+").replace(/_/g, "/") + "="),
        (c) => c.charCodeAt(0),
      );
    }
    async function credentials(fp) {
      const prefix = new TextEncoder().encode("couch-tunnel/1 ice");
      const input = new Uint8Array(prefix.length + fp.length);
      input.set(prefix);
      input.set(fp, prefix.length);
      const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", input));
      const b64 = (bytes) =>
        btoa(String.fromCharCode(...bytes)).replace(/=+$/, "");
      return { ufrag: b64(hash.slice(0, 6)), pwd: b64(hash.slice(6, 24)) };
    }
    function answer(offer, ip, port, fp, creds, session = "123456789") {
      const mid = /^a=mid:([^\r\n]+)$/m.exec(offer)?.[1];
      if (!mid) throw Error("offer has no mid");
      const hex = Array.from(fp, (b) =>
        b.toString(16).padStart(2, "0").toUpperCase(),
      ).join(":");
      return [
        "v=0",
        `o=- ${session} 2 IN IP4 127.0.0.1`,
        "s=-",
        "t=0 0",
        `a=group:BUNDLE ${mid}`,
        "a=ice-lite",
        `m=application ${port} UDP/DTLS/SCTP webrtc-datachannel`,
        `c=IN IP4 ${ip}`,
        `a=mid:${mid}`,
        `a=ice-ufrag:${creds.ufrag}`,
        `a=ice-pwd:${creds.pwd}`,
        `a=fingerprint:sha-256 ${hex}`,
        "a=setup:passive",
        "a=sctp-port:5000",
        "a=max-message-size:262144",
        `a=candidate:1 1 udp 2130706431 ${ip} ${port} typ host`,
        "a=end-of-candidates",
        "",
      ].join("\r\n");
    }
    window.rtcHelpers = { decodeFingerprint, credentials, answer };
    // END PURE HELPERS

    const query = new URLSearchParams(location.search);
    const result = {
      userAgent: navigator.userAgent,
      knobs: Object.fromEntries(query),
      phases: {},
      ok: true,
    };
    const skip = new Set((query.get("skip") || "").split(","));
    const num = (key, fallback) => {
      const value = query.has(key) ? Number(query.get(key)) : fallback;
      if (!Number.isSafeInteger(value) || value < 0)
        throw Error(`invalid ${key}`);
      return value;
    };
    const timeout = (promise, ms, what) =>
      new Promise((resolve, reject) => {
        const timer = setTimeout(
          () => reject(Error(`${what} timeout (${ms} ms)`)),
          ms,
        );
        promise.then(
          (value) => {
            clearTimeout(timer);
            resolve(value);
          },
          (error) => {
            clearTimeout(timer);
            reject(error);
          },
        );
      });
    async function phase(name, run) {
      if (skip.has(name)) {
        result.phases[name] = { skipped: true };
        return;
      }
      const start = performance.now();
      try {
        result.phases[name] = {
          ok: true,
          ...(await run()),
          wallMs: performance.now() - start,
        };
      } catch (error) {
        result.ok = false;
        result.phases[name] = {
          ok: false,
          error: String(error),
          wallMs: performance.now() - start,
        };
      }
      document.getElementById("result").textContent = JSON.stringify(
        result,
        null,
        2,
      );
    }
    function channel(pc) {
      const dc = pc.createDataChannel("couch-tunnel/1");
      dc.binaryType = "arraybuffer";
      // Optional per-channel evidence uses milliseconds since page navigation.
      const trace =
        query.get("trace") === "1"
          ? { createdMs: performance.now(), messages: 0, bytes: 0 }
          : undefined;
      if (trace) {
        result.channels ??= [];
        result.channels.push(trace);
      }
      const messages = [],
        waiters = [];
      let failure;
      dc.onmessage = (event) => {
        if (trace) {
          trace.lastMessageMs = performance.now();
          trace.messages++;
          trace.bytes +=
            typeof event.data === "string"
              ? new TextEncoder().encode(event.data).length
              : event.data.byteLength;
          if (typeof event.data === "string") trace.lastText = event.data;
        }
        const next = waiters.shift();
        if (next) next.resolve(event.data);
        else messages.push(event.data);
      };
      const fail = (error) => {
        failure = error;
        for (const waiter of waiters.splice(0)) waiter.reject(error);
      };
      const closed = new Promise((resolve) => {
        dc.onclose = () => {
          if (trace) trace.closeEventMs = performance.now();
          fail(Error("channel closed"));
          resolve();
        };
      });
      const opened = new Promise((resolve, reject) => {
        dc.onopen = () => {
          if (trace) {
            trace.id = dc.id;
            trace.openMs = performance.now();
          }
          resolve();
        };
        dc.onerror = () => {
          const e = Error("channel error");
          reject(e);
          fail(e);
        };
      });
      // Attach rejection handlers at creation, including during the negative connect test.
      opened.catch(() => {});
      return {
        dc,
        opened,
        closed,
        next: () =>
          timeout(
            messages.length
              ? Promise.resolve(messages.shift())
              : failure
                ? Promise.reject(failure)
                : new Promise((resolve, reject) =>
                    waiters.push({ resolve, reject }),
                  ),
            30000,
            "message",
          ),
        close: async () => {
          if (trace) trace.closeRequestMs = performance.now();
          dc.close();
          try {
            await timeout(closed, 10000, "close");
          } catch (error) {
            if (trace) {
              trace.closeTimeoutMs = performance.now();
              trace.readyState = dc.readyState;
            }
            throw error;
          }
        },
      };
    }
    async function open(pc) {
      const ch = channel(pc);
      await timeout(ch.opened, 15000, "open");
      return ch;
    }
    async function echo(ch, bytes) {
      ch.dc.send(bytes);
      const received = await ch.next();
      if (!(received instanceof ArrayBuffer))
        throw Error("echo was not binary");
      const got = new Uint8Array(received);
      if (got.length !== bytes.length || got.some((b, i) => b !== bytes[i]))
        throw Error("echo mismatch");
    }
    async function get(ch, n, c) {
      const start = performance.now();
      ch.dc.send(JSON.stringify({ t: "get", n, c }));
      let received = 0;
      for (;;) {
        const message = await ch.next();
        if (typeof message === "string") {
          const end = JSON.parse(message);
          if (end.t !== "end" || end.n !== n || received !== n)
            throw Error(`invalid end: ${message}, received=${received}`);
          break;
        }
        const bytes = new Uint8Array(message);
        if (bytes.length !== Math.min(c, n - received))
          throw Error("chunk length mismatch");
        for (let i = 0; i < bytes.length; i++)
          if (bytes[i] !== ((received + i) & 255))
            throw Error("GET pattern mismatch");
        received += bytes.length;
      }
      const ms = performance.now() - start;
      return { bytes: received, chunkBytes: c, ms, MBps: received / 1000 / ms };
    }
    async function main() {
      let pc;
      try {
        const host = /^([^:]+):(\d+)$/.exec(query.get("h") || "");
        if (!host)
          throw Error("expected ?h=<LAN IPv4>:<port>&f=<base64url SHA-256>");
        const fp = decodeFingerprint(query.get("f") || "");
        if (query.get("neg") === "1") fp[0] ^= 1;
        const creds = await credentials(fp);
        pc = new RTCPeerConnection({ iceServers: [] });
        const initial = channel(pc);
        await phase("connect", async () => {
          const start = performance.now();
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          await pc.setRemoteDescription({
            type: "answer",
            sdp: answer(
              offer.sdp,
              host[1],
              Number(host[2]),
              fp,
              creds,
              String(Date.now()),
            ),
          });
          if (query.get("neg") === "1") {
            let connected = false;
            try {
              await timeout(initial.opened, 8000, "negative open");
              connected = true;
            } catch (e) {
              if (!String(e).includes("timeout")) throw e;
            }
            if (connected) throw Error("wrong fingerprint connected");
            return { rejected: true, deadlineMs: 8000 };
          }
          await timeout(initial.opened, 15000, "connect");
          return { ms: performance.now() - start };
        });
        if (query.get("neg") === "1") return;
        for (const [name, run] of [
          [
            "rtt",
            async () => {
              const ch = await open(pc),
                samples = [];
              try {
                for (let i = 0; i < 200; i++) {
                  const start = performance.now();
                  await echo(ch, new Uint8Array(1024).fill(i));
                  samples.push(performance.now() - start);
                }
              } finally {
                await ch.close();
              }
              samples.sort((a, b) => a - b);
              return {
                count: 200,
                bytes: 1024,
                p50Ms: samples[99],
                p95Ms: samples[189],
                maxMs: samples[199],
              };
            },
          ],
          ...[16384, 65536].map((c) => [
            `get${c}`,
            async () => {
              const ch = await open(pc);
              try {
                return await get(ch, num("get", 8 * 1024 * 1024), c);
              } finally {
                await ch.close();
              }
            },
          ]),
          [
            "sequential",
            async () => {
              const count = num("seq", 2000);
              for (let i = 0; i < count; i++) {
                const ch = await open(pc);
                try {
                  await echo(ch, new Uint8Array(64).fill(i & 255));
                } finally {
                  await ch.close();
                }
              }
              return { count };
            },
          ],
          [
            "concurrent",
            async () => {
              const count = num("conc", 64);
              const transfers = await Promise.all(
                Array.from({ length: count }, async () => {
                  const ch = await open(pc);
                  try {
                    return await get(ch, 256 * 1024, 16384);
                  } finally {
                    await ch.close();
                  }
                }),
              );
              return {
                count,
                bytes: transfers.reduce((n, t) => n + t.bytes, 0),
              };
            },
          ],
        ])
          await phase(name, run);
        await phase("stats", async () => {
          await initial.close();
          const ch = await open(pc);
          try {
            ch.dc.send(JSON.stringify({ t: "stats" }));
            const stats = JSON.parse(await ch.next());
            if (stats.t !== "stats" || stats.open !== 1)
              throw Error(`unexpected stats: ${JSON.stringify(stats)}`);
            return stats;
          } finally {
            await ch.close();
          }
        });
        await phase("transport", async () => {
          const transports = [];
          (await pc.getStats()).forEach((s) => {
            if (s.type === "transport")
              transports.push({
                dtlsState: s.dtlsState,
                dtlsCipher: s.dtlsCipher,
                dtlsRole: s.dtlsRole,
                tlsVersion: s.tlsVersion,
                selectedCandidatePairId: s.selectedCandidatePairId,
              });
          });
          return { transports };
        });
      } catch (error) {
        result.ok = false;
        result.phases.setup = { ok: false, error: String(error) };
      } finally {
        pc?.close();
        window.__rtcResult = result;
        document.getElementById("result").textContent = JSON.stringify(
          result,
          null,
          2,
        );
      }
    }
    main();
  </script>
</html>
