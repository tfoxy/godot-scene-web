; The web-export receiver's one preset (gate7-design.md D5, G7e). Export only through
; scripts/build-web-receiver.sh: it stages a copy of receiver/ under the ignored
; artifacts/render-stream/web-receiver/<sha>/, checks the non-mono 4.5.1 editor's and the template's
; sha256, replaces @RS_WEB_TEMPLATE@ below with the pinned template's absolute path
; (~/.cache/godot-render-stream/templates/4.5.1-stable/web_nothreads_release.zip, sha256
; 7f6c5efc9952f6f02509adfb92298161c0152a1f6a81c0bf9b9f4f913676e9c8), and exports. An editor export
; from this file as committed fails on the placeholder, by design.
;
; Decided keys (D5): no threads and no GDExtension (no COOP/COEP, no emscripten toolchain);
; canvas_resize_policy 0 (the shell sizes the canvas to the presentation size); no PWA; the custom
; shell receiver/web/shell.html; no icons. Scripts are exported as text (script_export_mode 0), so
; the .pck carries the same GDScript source the native receiver runs. tests/ is excluded: the
; self-tests are native-only tools, and nothing from fixtures/ is ever reachable from receiver/.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=0

[preset.0.options]

custom_template/debug=""
custom_template/release="@RS_WEB_TEMPLATE@"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
threads/emscripten_pool_size=8
threads/godot_pool_size=4
