; HYG2 track-inject-addon-strict fixture: the project settings of ../track-inject (GDScript
; warnings that are errors: untyped_declaration and the unsafe_* family) PLUS
; debug/gdscript/warnings/exclude_addons=false, so res://addons/ scripts are held to those
; warnings too. Godot reads override.cfg beside project.godot after it, so project.godot (a link to
; ../track-inject) stays the single copy of everything else. The observer logs the effective
; values in its `contract` event and the g8l-trk-inject-strict check requires them.

[debug]

gdscript/warnings/exclude_addons=false
