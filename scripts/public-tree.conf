# Public tree policy, enforced by scripts/check-public-tree.py (pnpm check, the pre-push hook,
# scripts/remote-validate.sh and the publish workflow).
#
# One rule per line, `<kind> <value>`; blank lines and lines starting with `#` are ignored.
#
#   allow-md <glob>        every tracked *.md / *.mdx must match one of these. A new public doc
#                          needs its own line here; anything else belongs in private/.
#   deny <glob>            no tracked path may match, and no pushed commit may add or modify one.
#                          A glob that matches a directory denies everything under it.
#   deny-text <regex>      Python regex; no line of a tracked text file may match (git grep -I).
#   allow-text <literal>   a deny-text match lying inside this literal is exempt (placeholders).
#   old-root <sha>         full sha of a root commit of the history before a rewrite; a pushed ref
#                          that still descends from it is refused.
#
# Globs match repo-relative POSIX paths from the root: `*` and `?` stay within one path segment,
# `**` as a whole segment spans any number of segments (zero included), `[abc]` is a class.
#
# private/public-tree-private.conf, when the private companion is checked out, adds rules in the
# same format. Its violations are reported by rule number, never by pattern.

# ---- pre-rewrite history ---------------------------------------------------------------------
old-root 61ae27802ca05d3331ad88a8a6389faf44832931

# ---- personal data -------------------------------------------------------------------------
# Steam64 account ids; the documented placeholder is allowed.
deny-text \b7656119[0-9]{10}\b
allow-text 76561197960265729

# ---- internal material ---------------------------------------------------------------------
deny private
deny private/**
deny .ai/**
deny docs/agents/**
deny **/results/**
deny **/handoff-*
deny **/*-handoff.md
deny **/*-design.md
deny **/ledger*
deny **/bench/**/*.ndjson
deny **/benches/**/*.ndjson
deny **/perf/**/*.ndjson

# ---- markdown allowlist --------------------------------------------------------------------
# Top level
allow-md AGENTS.md
allow-md CLAUDE.md
allow-md CHANGELOG.md
allow-md CONTRIBUTING.md
allow-md README.md

# docs/
allow-md docs/architecture.md
allow-md docs/commit-and-release.md
allow-md docs/contribution-review.md
allow-md docs/input.md
allow-md docs/layout.md
allow-md docs/parity.md
allow-md docs/parser.md
allow-md docs/perf-harness.md
allow-md docs/perf-report-contract.md
allow-md docs/text-rendering.md
allow-md docs/vue.md

# Skills that stay public
allow-md skills/release-notes/SKILL.md

# Packages
allow-md packages/*/README.md
allow-md packages/canvas/msdf-generator/README.md
allow-md packages/canvas/rust-prototype/README.md

# Vendored third-party code: licence notices and provenance
allow-md **/vendor/*.md
allow-md **/vendor/**/README.md
allow-md **/PROVENANCE.md
allow-md **/THIRD_PARTY_NOTICES.md

# Fixtures
allow-md fixtures/**/README.md
allow-md experiments/render-stream/fixtures/*/README.md

# render-stream: wire specs and the READMEs of its code directories
allow-md experiments/render-stream/README.md
allow-md experiments/render-stream/protocol/render-stream-*.md
allow-md experiments/render-stream/protocol/streaming-host.md
allow-md experiments/render-stream/capture/README.md
allow-md experiments/render-stream/receiver/README.md
allow-md experiments/render-stream/rs-core/README.md
allow-md experiments/render-stream/rs-core-capi/README.md
allow-md experiments/render-stream/rs-net/README.md
allow-md experiments/render-stream/scripts/README.md
allow-md experiments/render-stream/scripts/test/**/README.md
allow-md experiments/render-stream/third_party/*/README.md
allow-md experiments/render-stream/web/*/README.md
